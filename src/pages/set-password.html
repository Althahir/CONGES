<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athelia - Création du mot de passe</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/set-password.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <img id="logo" src="../assets/logo_horiz_fdBlanc.png" alt="La Ciotat Entreprendre">
            <h2>Gestion des Congés</h2>
            
            <h1>Première connexion</h1>
            
            <p style="text-align: center; margin-bottom: 20px; color: #666;">
                Bienvenue <strong id="userName"></strong> ! <br>
                Veuillez choisir un mot de passe sécurisé.
            </p>
            
            <form id="setPasswordForm">
                <div class="form-group">
                    <label for="newPassword">Nouveau mot de passe</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6">
                    <small>Minimum 6 caractères</small>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>
                
                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>
                
                <button type="submit" class="btn-primary">Valider</button>
            </form>
        </div>
    </div>
    
    <script src="../js/set-password.js"></script>
</body>
</html>
