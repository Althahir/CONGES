<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaCiotatEntrprendre - Mon espace</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard-user.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <img src="../assets/logo.png" alt="Logo" class="header-logo">
            </div>
            <div class="header-center">
                <h1 id="headerTitle">Mes Congés</h1>
            </div>
            <div class="header-right">
                <button id="btnThemeToggle" class="btn-theme-toggle" title="Changer de thème">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <span id="userName" class="user-name">Chargement...</span>
                <button id="logoutBtn" class="btn-secondary btn-small">Déconnexion</button>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="user-nav">
            <div class="nav-left">
                <button class="nav-btn active" data-section="mes-conges">
                    <i class="fa-solid fa-user"></i> Mes congés
                </button>
                <button class="nav-btn" data-section="calendrier">
                    <i class="fa-regular fa-calendar"></i> Calendrier Global
                </button>
            </div>
            <div class="nav-right">
                <div class="year-nav">
                    <button id="btnPrevYear" class="btn-year-nav"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="anneeActuelle">2026</span>
                    <button id="btnNextYear" class="btn-year-nav"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </nav>

        <!-- Section Mes Congés -->
        <section id="mes-conges-section" class="content-section active">
        <div class="dashboard-content-new">
            <!-- Colonne gauche : Légende + Soldes + Formulaire -->
            <aside class="sidebar-left-new">
                <!-- Légende -->
                <div class="panel-section legende-section">
                    <h2><i class="fa-solid fa-palette"></i> Légende</h2>
                    <div class="legende-item">
                        <span class="legende-color cp"></span>
                        <span>Congés payés (CP)</span>
                    </div>
                    <div class="legende-item">
                        <span class="legende-color rtt"></span>
                        <span>RTT</span>
                    </div>
                    <div class="legende-item">
                        <span class="legende-color recup"></span>
                        <span>Récupération</span>
                    </div>
                    <div class="legende-item">
                        <span class="legende-color maladie"></span>
                        <span>Arrêt maladie</span>
                    </div>
                    <div class="legende-item">
                        <span class="legende-color ferie"></span>
                        <span>Jour férié</span>
                    </div>
                </div>

                <!-- Soldes -->
                <div class="panel-section soldes-section-new">
                    <h2><i class="fa-solid fa-chart-bar"></i> Mes soldes</h2>
                    <div class="soldes-grid-compact">
                        <div class="solde-card-compact cp-n1">
                            <div class="solde-label-compact">CP N-1</div>
                            <div class="solde-value-compact" id="solde-cp-n1">-</div>
                            <div class="solde-pending" id="solde-cp-n1-pending"></div>
                        </div>
                        <div class="solde-card-compact cp-n">
                            <div class="solde-label-compact">CP N</div>
                            <div class="solde-value-compact" id="solde-cp-n">-</div>
                            <div class="solde-pending" id="solde-cp-n-pending"></div>
                        </div>
                        <div class="solde-card-compact rtt">
                            <div class="solde-label-compact">RTT</div>
                            <div class="solde-value-compact" id="solde-rtt">-</div>
                            <div class="solde-pending" id="solde-rtt-pending"></div>
                        </div>
                        <div class="solde-card-compact recup">
                            <div class="solde-label-compact">Récup</div>
                            <div class="solde-value-compact" id="solde-recup">-</div>
                            <div class="solde-pending" id="solde-recup-pending"></div>
                        </div>
                    </div>
                    
                    <!-- Bouton Heures sup (visible uniquement si a_droit_recup) -->
                    <button id="btnAjouterHeuresSup" class="btn-heures-sup" style="display: none;">
                        <i class="fa-solid fa-plus"></i> Ajouter heures sup
                    </button>
                </div>

                <!-- Mes demandes en cours (workflow validation) -->
                <div class="panel-section mes-demandes-section" id="mesDemandesCours" style="display: none;">
                    <h2><i class="fa-solid fa-hourglass-half"></i> En attente de validation</h2>
                    <div id="mesDemandesCoursListe" class="mes-demandes-liste"></div>
                </div>

                <!-- Modal Heures Supplémentaires -->
                <div id="modalHeuresSup" class="modal" style="display: none;">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3><i class="fa-solid fa-clock"></i> Ajouter des heures supplémentaires</h3>
                            <button id="closeModalHeuresSup" class="close-modal">
                                <i class="fa-solid fa-times"></i>
                            </button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group-compact">
                                <label for="heuresSupNb">Nombre d'heures *</label>
                                <input type="number" id="heuresSupNb" min="0.5" step="0.5" placeholder="Ex: 3.5">
                            </div>
                            <div class="form-group-compact">
                                <label for="heuresSupDate">Date *</label>
                                <input type="date" id="heuresSupDate">
                            </div>
                            <div class="form-group-compact">
                                <label for="heuresSupCommentaire">Commentaire</label>
                                <textarea id="heuresSupCommentaire" rows="3" placeholder="Description du travail effectué..."></textarea>
                            </div>
                            <div id="heuresSupMsg" style="display: none;"></div>
                        </div>
                        <div class="modal-footer">
                            <button id="btnAnnulerHeuresSup" class="btn-secondary">Annuler</button>
                            <button id="btnEnregistrerHeuresSup" class="btn-primary">Enregistrer</button>
                        </div>
                    </div>
                </div>

                <!-- Formulaire -->
                <div class="panel-section form-section">
                    <h2><i class="fa-solid fa-plus-circle"></i> Poser une absence</h2>
                    <form id="formAbsence">
                        <div class="form-group-compact">
                            <!-- <label for="typeAbsence">Type *</label> -->
                            <select id="typeAbsence" name="typeAbsence" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="CP">Congés payés (CP)</option>
                            </select>
                        </div>

                        <div class="form-row-compact">
                            <div class="form-group-compact">
                                <label for="dateDebut">Du *</label>
                                <input type="date" id="dateDebut" name="dateDebut" required>
                                <div class="period-toggle">
                                    <button type="button" class="period-btn active" data-target="debutAprem" data-value="am">Matin</button>
                                    <button type="button" class="period-btn" data-target="debutAprem" data-value="pm">Après-midi</button>
                                </div>
                                <input type="hidden" id="debutAprem" value="am">
                            </div>
                            <div class="form-group-compact">
                                <label for="dateFin">Au *</label>
                                <input type="date" id="dateFin" name="dateFin" required>
                                <div class="period-toggle">
                                    <button type="button" class="period-btn" data-target="finMidi" data-value="am">Matin</button>
                                    <button type="button" class="period-btn active" data-target="finMidi" data-value="pm">Après-midi</button>
                                </div>
                                <input type="hidden" id="finMidi" value="pm">
                            </div>
                        </div>

                        <!-- Champs Récup -->
                        <div id="recupFields" style="display: none;">
                            <div class="form-group-compact">
                                <label for="recupType">Type *</label>
                                <select id="recupType" name="recupType">
                                    <option value="jours">En jours (7h/j)</option>
                                    <option value="heures">En heures</option>
                                </select>
                            </div>
                            <div class="form-group-compact" id="recupHeuresGroup" style="display: none;">
                                <label for="recupHeures">Heures *</label>
                                <input type="number" id="recupHeures" name="recupHeures" min="0.5" step="0.5">
                            </div>
                        </div>

                        <div class="form-group-compact">
                            <label for="commentaire">Commentaire</label>
                            <textarea id="commentaire" name="commentaire" rows="2"></textarea>
                        </div>

                        <!-- Résumé -->
                        <div id="resumeAbsence" class="resume-compact" style="display: none;">
                            <div class="resume-header-row">
                                <span><strong>Durée:</strong> <span id="resumeDuree">-</span></span>
                            </div>
                            <div id="resumeDecompte" class="resume-decompte"></div>
                            <div id="alerteSolde" class="alert-compact"></div>
                            <div id="alertePeriode" class="alert-compact"></div>
                        </div>

                        <div id="errorMessage" class="error-message"></div>
                        <div id="successMessage" class="success-message"></div>

                        <div class="form-actions-compact">
                            <div class="btn-submit-wrapper" id="btnSubmitWrapper">
                                <button type="submit" id="btnValider" class="btn-primary btn-small" disabled>Valider</button>
                            </div>
                        </div>
                    </form>
                </div>
            </aside>

            <!-- Colonne droite : Calendrier -->
            <div class="calendar-section-new">
                <div id="calendrierAnnuel" class="calendrier-grid">
                    <!-- Les 12 mois seront générés dynamiquement ici -->
                </div>
            </div>
        </div>
        </section>

        <!-- Section Calendrier Global -->
        <section id="calendrier-section" class="content-section">
            <div id="calendrierGlobal" class="calendrier-global">
                <!-- Sera rempli dynamiquement -->
            </div>
        </section>
    </div>

    <script src="../js/dashboard-user.js"></script>
</body>
</html>
